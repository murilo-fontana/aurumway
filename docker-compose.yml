services:
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: aurum
      RABBITMQ_DEFAULT_PASS: aurum
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  billing-db:
    image: postgres:16
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing"]
      interval: 10s
      timeout: 5s
      retries: 5

  payments-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 10s
      timeout: 5s
      retries: 5

  contracts-db:
    image: postgres:16
    environment:
      POSTGRES_DB: contracts
      POSTGRES_USER: contracts
      POSTGRES_PASSWORD: contracts
    ports: ["5435:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contracts"]
      interval: 10s
      timeout: 5s
      retries: 5

  billing:
    build: ./aurumway-billing
    ports: ["8082:8082"]
    environment:
      BILLING_DB_URL: jdbc:postgresql://billing-db:5432/billing
      BILLING_DB_USERNAME: billing
      BILLING_DB_PASSWORD: billing
      JWT_SECRET: ${JWT_SECRET:-dev-local-insecure-jwt-secret-change-me-in-production-0123456789}
      ALLOWED_TENANTS: ${ALLOWED_TENANTS:-acme-corp,globex-inc,default}
      SCHEDULING_ENABLED: ${SCHEDULING_ENABLED:-true}
      MARK_OVERDUE_CRON: ${MARK_OVERDUE_CRON:-0 0 1 * * *}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-100}
      RATE_LIMIT_REFILL_SECONDS: ${RATE_LIMIT_REFILL_SECONDS:-60}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: aurum
      SPRING_RABBITMQ_PASSWORD: aurum
    depends_on:
      billing-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payments:
    build: ./aurumway-payments
    ports: ["8081:8081"]
    environment:
      PAYMENTS_DB_URL: jdbc:postgresql://payments-db:5432/payments
      PAYMENTS_DB_USERNAME: payments
      PAYMENTS_DB_PASSWORD: payments
      JWT_SECRET: ${JWT_SECRET:-dev-local-insecure-jwt-secret-change-me-in-production-0123456789}
      ALLOWED_TENANTS: ${ALLOWED_TENANTS:-acme-corp,globex-inc,default}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SCHEDULING_ENABLED: ${SCHEDULING_ENABLED:-true}
      OUTBOX_POLL_DELAY_MS: ${OUTBOX_POLL_DELAY_MS:-10000}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-100}
      RATE_LIMIT_REFILL_SECONDS: ${RATE_LIMIT_REFILL_SECONDS:-60}
      STRIPE_RETRY_MAX_ATTEMPTS: ${STRIPE_RETRY_MAX_ATTEMPTS:-3}
      STRIPE_CB_FAILURE_RATE: ${STRIPE_CB_FAILURE_RATE:-50}
      STRIPE_CB_OPEN_WAIT: ${STRIPE_CB_OPEN_WAIT:-30s}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: aurum
      SPRING_RABBITMQ_PASSWORD: aurum
    depends_on:
      payments-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  contracts:
    build: ./aurumway-contracts
    ports: ["8083:8083"]
    environment:
      CONTRACTS_DB_URL: jdbc:postgresql://contracts-db:5432/contracts
      CONTRACTS_DB_USERNAME: contracts
      CONTRACTS_DB_PASSWORD: contracts
      JWT_SECRET: ${JWT_SECRET:-dev-local-insecure-jwt-secret-change-me-in-production-0123456789}
      ALLOWED_TENANTS: ${ALLOWED_TENANTS:-acme-corp,globex-inc,default}
      SCHEDULING_ENABLED: ${SCHEDULING_ENABLED:-true}
      RECURRING_INVOICES_CRON: ${RECURRING_INVOICES_CRON:-0 0 2 * * *}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-100}
      RATE_LIMIT_REFILL_SECONDS: ${RATE_LIMIT_REFILL_SECONDS:-60}
      BILLING_RETRY_MAX_ATTEMPTS: ${BILLING_RETRY_MAX_ATTEMPTS:-3}
      BILLING_CB_FAILURE_RATE: ${BILLING_CB_FAILURE_RATE:-50}
      BILLING_CB_OPEN_WAIT: ${BILLING_CB_OPEN_WAIT:-30s}
      BILLING_SERVICE_URL: http://billing:8082
    depends_on:
      contracts-db:
        condition: service_healthy
      billing:
        condition: service_started
