spring.application.name=aurumway-billing
server.port=${SERVER_PORT:8082}

# ── Graceful Shutdown ────────────────────────────────
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}

# ── PostgreSQL ───────────────────────────────────────
spring.datasource.url=${BILLING_DB_URL:jdbc:postgresql://localhost:5433/billing}
spring.datasource.username=${BILLING_DB_USERNAME:billing}
spring.datasource.password=${BILLING_DB_PASSWORD:billing}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool ────────────────────────
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# ── JPA ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Flyway ───────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JWT ──────────────────────────────────────────────
jwt.secret=${JWT_SECRET:}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# ── Multi-tenancy ───────────────────────────────────
app.allowed-tenants=${ALLOWED_TENANTS:acme-corp,globex-inc,default}

# ── Logging ──────────────────────────────────────────
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.dev.murilofontana.aurumway=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}

# ── Actuator ─────────────────────────────────────────
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:never}

# ── Server Error Handling ────────────────────────────
server.error.include-stacktrace=never
server.error.include-message=never

# ── Response Compression ─────────────────────────────
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/plain
server.compression.min-response-size=1024
