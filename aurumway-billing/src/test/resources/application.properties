# Test config. Datasource is provided by Testcontainers @ServiceConnection.
jwt.secret=test-secret-key-that-is-at-least-32-bytes-long-for-hs256
jwt.expiration-hours=1
app.allowed-tenants=acme-corp,globex-inc,default
spring.flyway.enabled=true
logging.level.root=WARN

# RabbitMQ is not available in tests; don't start listeners or attempt declarations.
messaging.payments.exchange=aurumway.payments.events
messaging.payments.routing-key.succeeded=payment.succeeded
messaging.payments.queue=billing.payment-succeeded
spring.rabbitmq.listener.simple.auto-startup=false
scheduling.enabled=false
rate-limit.enabled=false
