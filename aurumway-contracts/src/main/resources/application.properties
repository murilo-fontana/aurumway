spring.application.name=aurumway-contracts
server.port=${SERVER_PORT:8083}

# ── Graceful Shutdown ────────────────────────────────
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}

# ── PostgreSQL ───────────────────────────────────────
spring.datasource.url=${CONTRACTS_DB_URL:jdbc:postgresql://localhost:5435/contracts}
spring.datasource.username=${CONTRACTS_DB_USERNAME:contracts}
spring.datasource.password=${CONTRACTS_DB_PASSWORD:contracts}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool ────────────────────────
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# ── JPA ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Flyway ───────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JWT ──────────────────────────────────────────────
jwt.secret=${JWT_SECRET:dev-local-insecure-jwt-secret-change-me-in-production-0123456789}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# ── Multi-tenancy ───────────────────────────────────
app.allowed-tenants=${ALLOWED_TENANTS:acme-corp,globex-inc,default}

# ── Scheduling ───────────────────────────────────────
scheduling.enabled=${SCHEDULING_ENABLED:true}
scheduling.recurring-invoices.cron=${RECURRING_INVOICES_CRON:0 0 2 * * *}

# ── Logging ──────────────────────────────────────────
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.dev.murilofontana.aurumway=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}

# ── Actuator ─────────────────────────────────────────
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:when_authorized}
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# ── Observability (metrics & tracing) ────────────────
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLING:1.0}

# ── Server Error Handling ────────────────────────────
server.error.include-stacktrace=never
server.error.include-message=never

# ── Response Compression ─────────────────────────────
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/plain
server.compression.min-response-size=1024

# ── Rate Limiting ────────────────────────────────────
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.capacity=${RATE_LIMIT_CAPACITY:100}
rate-limit.refill-period-seconds=${RATE_LIMIT_REFILL_SECONDS:60}

# ── Resilience4j (billing inter-service calls) ───────
resilience4j.retry.instances.billing.max-attempts=${BILLING_RETRY_MAX_ATTEMPTS:3}
resilience4j.retry.instances.billing.wait-duration=${BILLING_RETRY_WAIT:500ms}
resilience4j.retry.instances.billing.enable-exponential-backoff=true
resilience4j.retry.instances.billing.exponential-backoff-multiplier=2
resilience4j.retry.instances.billing.retry-exceptions=org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException

resilience4j.circuitbreaker.instances.billing.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.billing.sliding-window-size=${BILLING_CB_WINDOW:10}
resilience4j.circuitbreaker.instances.billing.failure-rate-threshold=${BILLING_CB_FAILURE_RATE:50}
resilience4j.circuitbreaker.instances.billing.wait-duration-in-open-state=${BILLING_CB_OPEN_WAIT:30s}
resilience4j.circuitbreaker.instances.billing.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.billing.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.billing.record-exceptions=org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException
resilience4j.circuitbreaker.instances.billing.register-health-indicator=true

# ── Inter-service Communication ──────────────────────
billing.service.url=${BILLING_SERVICE_URL:http://localhost:8082}
